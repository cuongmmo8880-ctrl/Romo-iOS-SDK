name: Build HelloRMCore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.16.2

      - name: Install Pods
        working-directory: RMCore/Examples/HelloRMCore
        run: pod install --repo-update

      - name: Build HelloRMCore
        working-directory: RMCore/Examples/HelloRMCore
        run: |
          set +e

          xcodebuild \
            -workspace HelloRMCore.xcworkspace \
            -scheme HelloRMCore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "XCODEBUILD EXIT CODE: $BUILD_STATUS"
          echo "========================================"

          echo ""
          echo "===== XCODE ERRORS ====="
          grep -n -i "error:" build.log || true

          echo ""
          echo "===== FAILED TARGETS ====="
          grep -n -i "failed" build.log || true

          echo ""
          echo "===== LAST 100 LINES ====="
          tail -100 build.log

          exit $BUILD_STATUS

      - name: Package IPA
        working-directory: RMCore/Examples/HelloRMCore
        run: |
          mkdir -p artifacts/Payload

          APP_PATH=$(find build -type d -name "HelloRMCore.app" | head -1)

          echo "APP_PATH=$APP_PATH"

          test -n "$APP_PATH" || exit 1

          cp -R "$APP_PATH" artifacts/Payload/HelloRMCore.app

          cd artifacts
          zip -r HelloRMCore-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HelloRMCore-unsigned
          path: RMCore/Examples/HelloRMCore/artifacts/HelloRMCore-unsigned.ipa
