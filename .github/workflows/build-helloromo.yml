name: Build HelloRomo

on:
  workflow_dispatch:
  push:
    branches:
      - hello-gateway

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install CocoaPods
        run: sudo gem install cocoapods -v 1.16.2

      - name: Install Pods
        working-directory: RMCore/Examples/HelloRomo
        run: pod install --repo-update

      - name: Build HelloRomo
        working-directory: RMCore/Examples/HelloRomo
        run: |
          set +e

          xcodebuild \
            -workspace HelloRomo.xcworkspace \
            -scheme HelloRomo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "XCODEBUILD EXIT CODE: $BUILD_STATUS"
          echo "========================================"

          echo ""
          echo "===== XCODE ERRORS ====="
          grep -n -i "error:" build.log || true

          echo ""
          echo "===== BUILD FAILED ====="
          grep -n -i "BUILD FAILED" build.log || true

          echo ""
          echo "===== LAST 100 LINES ====="
          tail -100 build.log

          exit $BUILD_STATUS

      - name: Package IPA
        if: success()
        working-directory: RMCore/Examples/HelloRomo
        run: |
          mkdir -p artifacts/Payload

          APP_PATH=$(find build -type d -name "HelloRomo.app" | head -1)

          echo "APP_PATH=$APP_PATH"

          test -n "$APP_PATH" || exit 1

          cp -R "$APP_PATH" artifacts/Payload/HelloRomo.app

          cd artifacts
          zip -r HelloRomo-unsigned.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HelloRomo-unsigned
          path: RMCore/Examples/HelloRomo/artifacts/HelloRomo-unsigned.ipa
