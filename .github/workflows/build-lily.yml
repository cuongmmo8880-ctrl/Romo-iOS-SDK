name: Build Lily Rebuild

on:
  push:
    branches:
      - hello-gateway
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Restore Git LFS objects
        run: |
          set -e

          echo "=== Git LFS version ==="
          git lfs version

          echo "=== Git attributes ==="
          git check-attr filter -- Lily-Rebuild/Frameworks/Shared.framework/Shared

          echo "=== LFS tracked Shared ==="
          git lfs ls-files -l | grep "Lily-Rebuild/Frameworks/Shared.framework/Shared"

          echo "=== Fetch Shared ==="
          git lfs fetch origin "$GITHUB_SHA" \
            --include="Lily-Rebuild/Frameworks/Shared.framework/Shared"

          echo "=== Checkout Shared ==="
          git lfs checkout "Lily-Rebuild/Frameworks/Shared.framework/Shared"

          echo "=== Verify Shared ==="
          ls -lh Lily-Rebuild/Frameworks/Shared.framework/Shared
          file Lily-Rebuild/Frameworks/Shared.framework/Shared

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Verify recovered Shared.framework
        working-directory: Lily-Rebuild
        run: |
          set -e

          test -f Frameworks/Shared.framework/Shared

          echo "=== Shared.framework/Shared ==="
          ls -lh Frameworks/Shared.framework/Shared
          file Frameworks/Shared.framework/Shared

          SIZE=$(stat -f%z Frameworks/Shared.framework/Shared)
          echo "Shared size: $SIZE bytes"

          if head -n 1 Frameworks/Shared.framework/Shared | grep -q 'version https://git-lfs.github.com/spec/v1'; then
            echo "ERROR: Shared.framework/Shared is still a Git LFS pointer."
            exit 1
          fi

          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: Shared binary is suspiciously small."
            exit 1
          fi

      - name: Build Lily
        working-directory: Lily-Rebuild
        run: |
          set -o pipefail

          xcodebuild \
            -project LilyRebuild.xcodeproj \
            -scheme LilyRebuild \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Package IPA
        working-directory: Lily-Rebuild
        run: |
          set -e

          APP_PATH=$(find build -type d -name 'LilyRebuild.app' | head -1)
          test -n "$APP_PATH"

          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/LilyRebuild.app

          cd artifacts
          zip -qry LilyRebuild-unsigned.ipa Payload
          ls -lh LilyRebuild-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LilyRebuild-unsigned
          path: Lily-Rebuild/artifacts/LilyRebuild-unsigned.ipa